<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" preserveAspectRatio="none">
  <defs>
    <filter id="pigment" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="4" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.4" intercept="-.7"/>
        <feFuncG type="linear" slope="2.4" intercept="-.7"/>
        <feFuncB type="linear" slope="2.4" intercept="-.7"/>
      </feComponentTransfer>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="900" height="1200" filter="url(#pigment)" opacity=".42"/>
  <rect width="900" height="1200" filter="url(#paper)" opacity=".12"/>
</svg>
